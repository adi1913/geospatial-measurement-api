services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # The browser calls the API from the frontend's origin, so it must be allowed here.
      CORS_ORIGINS: "http://localhost:3000"
      MAX_UPLOAD_SIZE_MB: "20"
    volumes:
      - backend_data:/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: "http://localhost:8000"
        VITE_MAX_UPLOAD_MB: "20"
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  backend_data:
